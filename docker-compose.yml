services:
  db:
    image: postgres:16
    container_name: studio-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: studio-booking-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
